# Node outbox worker — same repo as web, different start command.
# Railway: add a second service from this repo, set Config-as-Code path to
# /railway.worker.toml (or copy startCommand below).
#
# Required env: DATABASE_URL
# Telegram outbound: TELEGRAM_BOT_TOKEN, AUTOMATION_ENABLED=true
# Optional: WORKER_ID, WORKER_POLL_INTERVAL_MS, WORKER_CLAIM_LIMIT
# Calendar (phase 2): GOOGLE_CALENDAR_ID, GOOGLE_SERVICE_ACCOUNT_JSON

[build]
builder = "NIXPACKS"
# Worker does not need Next.js build artifacts; generate Prisma client only.
buildCommand = "npx prisma generate"

[deploy]
startCommand = "npm run worker"
restartPolicyType = "ON_FAILURE"
numReplicas = 1
