# Web service (Admission-OS) — same Railway project as the worker.
# In the Railway dashboard, set this service's Config-as-Code path to /railway.toml
# (or paste these settings). Run migrations on web deploy so the worker sees new tables.

[build]
builder = "NIXPACKS"
# Force Tailwind Oxide native binding after npm ci (optionalDeps bug on cross-platform lockfiles)
buildCommand = "npm i --no-save @tailwindcss/oxide-linux-x64-gnu@4.3.3 @tailwindcss/oxide-linux-x64-musl@4.3.3 && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npm start"
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
numReplicas = 1
