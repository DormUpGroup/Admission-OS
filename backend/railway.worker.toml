# Hobby pilot caps — keep cost predictable; raise only after metrics show pressure.
# Start with one replica; scale only after fenced outbox lease rollout (see docs).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=orchestration,delivery,calendar,maintenance,programs"
restartPolicyType = "ON_FAILURE"
numReplicas = 1

[deploy.limitOverride.containers]
# 1 GB RAM, 1 vCPU
cpu = 1
memoryBytes = 1073741824
